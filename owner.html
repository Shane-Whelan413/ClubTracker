<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolfSoc — Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0a1628;
  --navy2: #112040;
  --navy3: #1a3050;
  --gold: #C9A84C;
  --gold2: #e8c96a;
  --green: #16a34a;
  --red: #ef4444;
  --amber: #f59e0b;
  --text: #f0f4ff;
  --text2: rgba(240,244,255,0.6);
  --text3: rgba(240,244,255,0.3);
  --border: rgba(240,244,255,0.08);
  --surface: rgba(240,244,255,0.04);
  --radius: 12px;
}

body {
  background: var(--navy);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

/* LOGIN */
#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%);
}

.login-logo {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}
.login-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.login-sub {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 40px;
}
.login-box {
  width: 100%;
  max-width: 360px;
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
}
.pin-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text3);
  margin-bottom: 12px;
}
.pin-input {
  width: 100%;
  background: var(--navy3);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 22px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  color: var(--text);
  letter-spacing: .3em;
  text-align: center;
  outline: none;
  margin-bottom: 16px;
  transition: border-color .2s;
}
.pin-input:focus { border-color: var(--gold); }
.login-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--gold);
  color: var(--navy);
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: opacity .2s;
}
.login-btn:hover { opacity: 0.9; }
.login-err {
  margin-top: 12px;
  font-size: 13px;
  color: var(--red);
  text-align: center;
  min-height: 20px;
}

/* DASHBOARD */
#dashboard { display: none; }

.topbar {
  background: var(--navy2);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-brand { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: .1em; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.refresh-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all .2s;
}
.refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
.signout-btn {
  background: none;
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
}

.main { padding: 24px; max-width: 960px; margin: 0 auto; }

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
@media (max-width: 600px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

.stat-card {
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.stat-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text3);
  margin-bottom: 8px;
}
.stat-value {
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.stat-value.gold { color: var(--gold); }
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* TABLE */
.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text3);
  margin-bottom: 12px;
}
.table-wrap {
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 32px;
}
.table-head {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 80px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
@media (max-width: 600px) {
  .table-head { grid-template-columns: 2fr 1fr 1fr; }
  .col-hide { display: none; }
}
.th {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text3);
}
.society-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 80px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background .15s;
}
@media (max-width: 600px) { .society-row { grid-template-columns: 2fr 1fr 1fr; } }
.society-row:last-child { border-bottom: none; }
.society-row:hover { background: var(--surface); }

.society-name { font-size: 14px; font-weight: 600; color: var(--text); }
.society-email { font-size: 11px; color: var(--text3); margin-top: 2px; }
.cell { font-size: 13px; color: var(--text2); }

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
}
.pill-active { background: rgba(22,163,74,0.15); color: #4ade80; border: 1px solid rgba(22,163,74,0.25); }
.pill-trial { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.25); }
.pill-expired { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
.pill-failed { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

.contact-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--text3);
  font-size: 11px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
  display: inline-block;
}
.contact-btn:hover { border-color: var(--gold); color: var(--gold); }

.empty { padding: 32px; text-align: center; color: var(--text3); font-size: 13px; }
.loading { padding: 32px; text-align: center; color: var(--text3); font-size: 13px; }

/* NEW SIGNUP TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--navy2);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 13px;
  color: var(--text);
  z-index: 1000;
  display: none;
  max-width: 300px;
}
.toast.show { display: block; animation: slideIn .3s ease; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">GolfSoc.ie</div>
  <div class="login-title">Owner Dashboard</div>
  <div class="login-sub">Private access only</div>
  <div class="login-box">
    <div class="pin-label">Enter PIN</div>
    <input type="password" id="pin-input" class="pin-input" placeholder="••••••" maxlength="6" inputmode="numeric" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="login-btn" onclick="checkPin()">Enter dashboard</button>
    <div class="login-err" id="pin-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">⛳ GolfSoc Owner</div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total societies</div>
        <div class="stat-value gold" id="stat-total">—</div>
        <div class="stat-sub">All time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active subscriptions</div>
        <div class="stat-value green" id="stat-active">—</div>
        <div class="stat-sub">Paying customers</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">On trial</div>
        <div class="stat-value" id="stat-trial">—</div>
        <div class="stat-sub">Free trial</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expired / failed</div>
        <div class="stat-value red" id="stat-expired">—</div>
        <div class="stat-sub">Need attention</div>
      </div>
    </div>

    <!-- Societies table -->
    <div class="section-title">All societies</div>
    <div class="table-wrap">
      <div class="table-head">
        <div class="th">Society</div>
        <div class="th">Status</div>
        <div class="th col-hide">Members</div>
        <div class="th col-hide">Trial ends</div>
        <div class="th col-hide">Signed up</div>
        <div class="th">Contact</div>
      </div>
      <div id="societies-list"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://nljcncrvqjtuwycemutz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5samNuY3J2cWp0dXd5Y2VtdXR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM3NjEwNDgsImV4cCI6MjA1OTMzNzA0OH0.1oFZvotFxMGCtRStFEHQSPNN5Wp5XJOHDFa6kNFGe4Q';
const OWNER_PIN = '199591';

var _authenticated = false;
var _societies = [];

function checkPin() {
  var pin = document.getElementById('pin-input').value.trim();
  if (pin === OWNER_PIN) {
    _authenticated = true;
    sessionStorage.setItem('gs_owner', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else {
    document.getElementById('pin-err').textContent = 'Incorrect PIN';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
}

function signOut() {
  sessionStorage.removeItem('gs_owner');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pin-input').value = '';
}

async function loadData() {
  document.getElementById('societies-list').innerHTML = '<div class="loading">Loading...</div>';
  try {
    var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

    // Fetch all societies
    var res = await fetch(SUPABASE_URL + '/rest/v1/societies?select=id,name,contact_email,subscription_status,trial_ends_at,created_at,stripe_customer_id&order=created_at.desc', { headers: h });
    var societies = await res.json();
    if (!Array.isArray(societies)) {
      document.getElementById('societies-list').innerHTML = '<div class="empty">No societies found — or check Supabase RLS permissions on the societies table.</div>';
      return;
    }

    _societies = societies;
    renderStats(societies);
    renderTable(societies, {});

  } catch(e) {
    document.getElementById('societies-list').innerHTML = '<div class="empty">Error loading data: ' + e.message + '</div>';
  }
}

function renderStats(societies) {
  var total = societies.length;
  var active = societies.filter(function(s){ return s.subscription_status === 'active'; }).length;
  var trial = societies.filter(function(s){ return s.subscription_status === 'trial'; }).length;
  var expired = societies.filter(function(s){ return s.subscription_status === 'expired' || s.subscription_status === 'payment_failed'; }).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-trial').textContent = trial;
  document.getElementById('stat-expired').textContent = expired;
}

function renderTable(societies, counts) {
  if (!societies.length) {
    document.getElementById('societies-list').innerHTML = '<div class="empty">No societies yet</div>';
    return;
  }

  var html = societies.map(function(s) {
    var status = s.subscription_status || 'trial';
    var pillClass = status === 'active' ? 'pill-active' : status === 'trial' ? 'pill-trial' : status === 'payment_failed' ? 'pill-failed' : 'pill-expired';
    var pillLabel = status === 'active' ? 'Active' : status === 'trial' ? 'Trial' : status === 'payment_failed' ? 'Failed' : 'Expired';

    // Trial days remaining
    var trialStr = '—';
    if (s.trial_ends_at && status === 'trial') {
      var daysLeft = Math.ceil((new Date(s.trial_ends_at) - new Date()) / (1000*60*60*24));
      trialStr = daysLeft > 0 ? daysLeft + 'd left' : 'Expired';
      if (daysLeft <= 3) trialStr = '<span style="color:var(--red)">' + trialStr + '</span>';
      else if (daysLeft <= 7) trialStr = '<span style="color:var(--amber)">' + trialStr + '</span>';
    } else if (status === 'active') {
      trialStr = '<span style="color:var(--green)">Subscribed</span>';
    }

    // Signed up date
    var signedUp = s.created_at ? new Date(s.created_at).toLocaleDateString('en-IE', { day:'numeric', month:'short', year:'numeric' }) : '—';

    var memberCount = counts[s.id] || 0;
    var email = s.contact_email || '';

    return '<div class="society-row">' +
      '<div><div class="society-name">' + (s.name || 'Unnamed') + '</div><div class="society-email">' + email + '</div></div>' +
      '<div class="cell"><span class="pill ' + pillClass + '">' + pillLabel + '</span></div>' +
      '<div class="cell col-hide">' + memberCount + '</div>' +
      '<div class="cell col-hide">' + trialStr + '</div>' +
      '<div class="cell col-hide">' + signedUp + '</div>' +
      '<div>' + (email ? '<a href="mailto:' + email + '" class="contact-btn">Email</a>' : '<span style="color:var(--text3);font-size:11px">No email</span>') + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('societies-list').innerHTML = html;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 5000);
}

// Check session on load
window.addEventListener('load', function() {
  if (sessionStorage.getItem('gs_owner') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  }
  document.getElementById('pin-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPin();
  });
});

// Poll for new signups every 60 seconds
var _lastCount = 0;
setInterval(async function() {
  if (!sessionStorage.getItem('gs_owner')) return;
  try {
    var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
    var res = await fetch(SUPABASE_URL + '/rest/v1/societies?select=id', { headers: h });
    var data = await res.json();
    if (_lastCount > 0 && data.length > _lastCount) {
      showToast('🎉 New society signed up!');
      loadData();
    }
    _lastCount = data.length;
  } catch(e) {}
}, 60000);
</script>
</body>
</html>
